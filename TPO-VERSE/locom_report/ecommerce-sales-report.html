<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10.10 Sale Order Report · Najmia Beauty</title><style>:root{--bg:#f6f8fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5eaf1;--accent:#e0457b}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2b;--ink:#e6edf7;--mut:#94a3b8;--line:#223049}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:40px 24px 60px}
.eyebrow{color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
h1{font-size:clamp(28px,4vw,42px);line-height:1.1;margin:8px 0 12px;letter-spacing:-.02em}
.lede{max-width:820px;font-size:17px;color:var(--mut);margin:0 0 16px}.lede b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;color:var(--mut)}
h2{font-size:20px;margin:44px 0 14px;letter-spacing:-.01em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:28px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--a,var(--accent));border-radius:12px;padding:14px 16px}
.kl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}.kv{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0}.kh{font-size:12px;color:var(--mut)}
.findings{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.finding{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.fn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px}
.finding h4{margin:0 0 4px;font-size:15px}.finding p{margin:0;color:var(--mut);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px 12px;min-width:0}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.card h3{margin:0;font-size:15px}.sub{margin:2px 0 8px;font-size:12.5px;color:var(--mut)}.note{margin:6px 0 0;font-size:12px;color:var(--mut);border-top:1px dashed var(--line);padding-top:6px}
.chart{width:100%}
.recs{display:grid;gap:10px}.recs div{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:12px 16px;font-size:14px}
.caveats{color:var(--mut);font-size:13.5px;padding-left:18px}.caveats li{margin:6px 0}.caveats b{color:var(--ink)}
footer{margin-top:40px;color:var(--mut);font-size:12px}a{color:var(--accent)}
@media (max-width:900px){.grid{grid-template-columns:1fr}.span2,.span3{grid-column:auto}.wrap{padding:24px 16px 48px}}

.tip{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.22);padding:8px 12px;font-size:12px;line-height:1.5;white-space:nowrap}

.card{position:relative}.card:hover,.card:focus-within{z-index:30}
.info{position:absolute;top:12px;right:12px}
.info button{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--mut);background:transparent;color:var(--mut);font:italic 700 13px/1 Georgia,serif;cursor:help;padding:0;display:grid;place-items:center}
.info button:hover,.info button:focus{border-color:var(--accent);color:var(--accent);outline:none}
.pop{display:none;position:absolute;top:30px;right:0;width:min(320px,78vw);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.28);padding:12px 14px;z-index:60}
.info:hover .pop,.info:focus-within .pop{display:block}
.pop .ph{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:0 0 2px}
.pop p{margin:0 0 10px;font-size:12.5px;line-height:1.5}.pop p:last-child{margin-bottom:0}
.card h3{padding-right:30px}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 12px}
.tools input{flex:1 1 240px;min-width:200px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.chipsrow{display:flex;flex-wrap:wrap;gap:6px}
.fc{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer}
.fc.on{background:var(--accent);border-color:var(--accent);color:#fff}.fc i{font-style:normal;opacity:.7;margin-left:6px}.fc.dl{margin-left:auto}
.tw{overflow:auto;max-height:680px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--card);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:hover td{background:rgba(224,69,123,.06)}
.num{text-align:right;font-variant-numeric:tabular-nums}.b{font-weight:700}.pos{color:#0f766e}.neg{color:#be123c}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px}.pn{max-width:380px;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11.5px;color:#fff;background:var(--c)}
.more{margin-top:10px;font-size:12px;color:var(--mut)}

.chain{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
.tile{flex:1 1 150px;min-width:140px;background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:10px 12px}
.tl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}.tv{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:2px 0}.th{font-size:11.5px;color:var(--mut);min-height:32px}
.tb{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}.tb i{display:block;height:100%;background:var(--c)}
.conn{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--mut)}
.conn .ar{font-size:18px;line-height:1;color:var(--mut)}.conn .ct{font-weight:700;color:var(--ink);font-size:13px}.conn.warn .ct{color:#be123c}
.na{flex:1 1 200px;align-self:center;font-size:12.5px;color:var(--mut)}
.selbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0 14px}
.selh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}.pnm{font-weight:700;font-size:15px}.psk{color:var(--mut);margin-top:2px}
.selbox .tile{background:var(--card)}
.checks{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:4px 18px;font-size:12.5px}
.checks li{padding-left:22px;position:relative}.checks li:before{position:absolute;left:0;font-weight:700}.checks .ok:before{content:'✓';color:#0f766e}.checks .bad:before{content:'✕';color:#be123c}
tr.sel td{background:rgba(224,69,123,.12)}tbody tr{cursor:pointer}
th{white-space:normal;vertical-align:bottom;line-height:1.25}
td.pc{white-space:normal;min-width:260px;max-width:340px}.pn{white-space:normal;max-width:none;line-height:1.3}.ps{color:var(--mut);margin-top:1px}
.pill{white-space:nowrap}
@media (max-width:900px){.conn{flex:1 1 100%;flex-direction:row;gap:8px}.conn .ar{transform:rotate(90deg)}}

td.pc{min-width:210px;max-width:260px}th,td{padding-left:7px;padding-right:7px}

.slider{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:6px 0 12px;font-size:13px}.slider input{width:260px;accent-color:var(--accent)}.slider span{color:var(--mut);font-size:12px}
.kpis.mini{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-top:6px}.kpis.mini .kv{font-size:22px}
td.warn{color:#b45309;font-weight:600}
