<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CTO Organization Diagram</title>
<style>
  :root {
    --bg: #ffffff;
    --big: #7ba3ec;
    --big-text: #ffffff;
    --pod: #dce8fa;
    --node: #eeeeee;
    --node-text: #222222;
    --cto: #1f4aa8;
    --funnel: #d9e6f7;
    --line: #555555;
    --biz: #e2d6f0;
    --star: #f5b800;
    --tagline: #2b5fb0;
    --green: #5b9a47;
    --hl: #f3b94d;

  body { margin: 0; background: var(--bg); font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; border-bottom: 2px solid var(--pod); }
  .tab { font: inherit; font-size: 15px; padding: 8px 18px; border: 0; background: none; color: #444; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tab[aria-selected="true"] { color: var(--cto); font-weight: 700; border-bottom-color: var(--cto); }
  .tab:focus-visible { outline: 2px solid var(--cto); outline-offset: 2px; }
  .panel[hidden] { display: none; }
  .clickable { cursor: pointer; }
  .clickable:hover .pod { fill: #c9dcf7; }
  .pod.hl { fill: var(--hl-pod); stroke: var(--hl); stroke-width: 3; }
  .clickable:hover .pod.hl { fill: #ffdc9a; }
  .big.hl { fill: var(--hl); }
  .mini.tpo { fill: var(--hl-tpo); stroke: #b87400; stroke-width: 1; }
  .tpo-text { fill: #3a2600; font-size: 6.5px; text-anchor: middle; }
  .squad-label { fill: #222; font-size: 11px; font-weight: 700; text-anchor: middle; }
  .f-name { fill: #222; font-size: 20px; }
  .arrow-line { stroke: #d98200; stroke-width: 4; fill: none; }
  .arrow-text { fill: #b86a00; font-size: 18px; font-weight: 700; }
  .ring-dash { fill: none; stroke: #f0a050; stroke-width: 3; stroke-dasharray: 10 8; }
  .tpo-c { fill: #ccf5d2; stroke: #6dd47e; stroke-width: 3; }
  .pmo-c { fill: var(--node); stroke: #ccc; stroke-width: 2; }
  .role-c { fill: var(--node); stroke: #ccc; stroke-width: 2; }
  .role-c.biz { fill: var(--biz); stroke: #bba8d6; }
  .d-text { fill: #222; font-size: 23px; text-anchor: middle; }
  .d-small { fill: #222; font-size: 19px; text-anchor: middle; }
  .tag { fill: #feebc0; stroke: #f9c840; stroke-width: 3; }
  .tag.alt { stroke: #3b9bf0; stroke-dasharray: 8 5; }
  .tag-text { fill: #222; font-size: 24px; text-anchor: middle; }
  .focus-ring { fill: none; stroke: #b87400; stroke-width: 3; stroke-dasharray: 8 6; }
  .f-title { fill: #1b2a4a; font-size: 34px; font-weight: 700; }
  .f-sub { fill: #555; font-size: 18px; }
  .f-role { fill: #222; font-size: 20px; }
  .f-role b { font-weight: 700; }
  svg { width: 100%; height: auto; display: block; }
  .big { fill: var(--big); }
  .big-label { fill: var(--big-text); font-weight: 700; font-size: 22px; text-anchor: middle; }
  .pod { fill: var(--pod); }
  .pod-label { fill: #222; font-size: 11px; text-anchor: middle; }
  .node { fill: var(--node); }
  .node-text { fill: var(--node-text); font-size: 16px; text-anchor: middle; }
  .mini { fill: var(--node); stroke: #fff; stroke-width: 1; }
  .mini.biz { fill: var(--biz); }
  .mini-text { fill: #222; font-size: 6.5px; text-anchor: middle; }
  .link { stroke: var(--line); stroke-width: 2; fill: none; }
  .funnel { fill: var(--funnel); }
  .cto { fill: var(--cto); }
  .cto-text { fill: #fff; font-weight: 700; font-size: 30px; text-anchor: middle; }
  .academy-text { fill: #fff; font-weight: 700; font-size: 25px; text-anchor: middle; }
  .univ { fill: var(--green); }
  .univ-text { fill: #fff; font-weight: 700; font-size: 25px; text-anchor: middle; }
  .star { fill: var(--star); }
</style>
</head>

<script>
(function () {
  var tabs = document.querySelectorAll('.tab');
  function show(id) {
    tabs.forEach(function (t) {
      var on = t.id === 'tab-' + id;
      t.setAttribute('aria-selected', on);
      document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
    });
  }
  tabs.forEach(function (t) {
    t.addEventListener('click', function () { show(t.id.replace('tab-', '')); });
  });
  var pod = document.getElementById('supply-pod');
  if (pod) pod.addEventListener('click', function () { show('supply'); });
  var arrow = document.getElementById('supply-arrow');
  if (arrow) arrow.addEventListener('click', function () { show('supply'); });
  var dpod = document.getElementById('deliver-pod');
  if (dpod) dpod.addEventListener('click', function () { show('deliver'); });
})();
</script>
